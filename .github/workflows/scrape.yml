name: 価格スクレイピング & 公開

on:
  schedule:
    # 毎日 00:17 UTC = 日本時間 09:17 に実行
    # （00分ちょうど/UTC0時は混雑で遅延・スキップされやすいため17分にずらす）
    - cron: "17 0 * * *"
  workflow_dispatch: {}   # 手動実行も可能

permissions:
  contents: write   # 履歴と HTML をリポジトリにコミットするため
  pages: write
  id-token: write

concurrency:
  group: scrape-and-pages
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存パッケージのインストール
        run: pip install -r requirements.txt

      - name: スクレイピング & HTML 生成
        env:
          PYTHONUNBUFFERED: "1"   # ログをリアルタイム出力（進捗確認用）
          # 任意: Amazon のブロック回避用。リポジトリ Secrets に設定すると有効化。
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
          SCRAPERAPI_OPTS: ${{ secrets.SCRAPERAPI_OPTS }}
          SCRAPER_PROXY: ${{ secrets.SCRAPER_PROXY }}
          # 価格変動を通知する Discord Webhook URL（設定すると有効化）
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python scraper.py

      - name: 履歴 & HTML をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history.json docs/index.html
          if git diff --staged --quiet; then
            echo "変更なし"
          else
            git commit -m "価格更新: $(date -u +%Y-%m-%d)"
            # 並行実行や開発中のpushと衝突しても確実に反映できるよう
            # rebase してからpush、失敗時はリトライ
            for i in 1 2 3 4 5; do
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                echo "pushed"; break
              fi
              echo "push retry $i"; sleep $((RANDOM % 5 + 2))
            done
          fi

      - name: Pages 用アーティファクトのアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages へデプロイ
        id: deployment
        uses: actions/deploy-pages@v4
