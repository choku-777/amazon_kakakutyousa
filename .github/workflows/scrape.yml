name: 価格スクレイピング & 公開

on:
  schedule:
    # 毎日 00:00 UTC = 日本時間 09:00 に実行
    - cron: "0 0 * * *"
  workflow_dispatch: {}   # 手動実行も可能

permissions:
  contents: write   # 履歴と HTML をリポジトリにコミットするため
  pages: write
  id-token: write

concurrency:
  group: scrape-and-pages
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存パッケージのインストール
        run: pip install -r requirements.txt

      - name: スクレイピング & HTML 生成
        env:
          # 任意: Amazon のブロック回避用。リポジトリ Secrets に設定すると有効化。
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
          SCRAPER_PROXY: ${{ secrets.SCRAPER_PROXY }}
        run: python scraper.py

      - name: 履歴 & HTML をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history.json docs/index.html
          if git diff --staged --quiet; then
            echo "変更なし"
          else
            git commit -m "価格更新: $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Pages 用アーティファクトのアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages へデプロイ
        id: deployment
        uses: actions/deploy-pages@v4
